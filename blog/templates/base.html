<!DOCTYPE html>
{% load static %}
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
                <meta http-equiv="x-ua-compatible" content="ie=edge" />
                <title>Jo-blog</title>
                <!-- MDB icon -->
                <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✒️</text></svg>">

                <!-- Font Awesome -->
                <link 
                rel="stylesheet" 
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
                />

                <!-- Google Fonts Roboto -->
                <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
                />

                <!-- MDB -->
                <link rel="stylesheet" href="{% static 'css/mdb.min.css' %}" />

                <!-- Navbar styles -->
                <link rel="stylesheet" href="{% static 'css/navbar.css' %}" />
                
                <!-- Footer styles -->
                <link rel="stylesheet" href="{% static 'css/footer.css' %}" />
    </head>
    <body>
        {% include '_nav.html' %}
            {% if messages %}
                <div class="position-fixed top-0 start-50 translate-middle-x mt-5 pt-4" style="z-index: 2000; width: min(90%, 480px);">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }} shadow site-alert" role="alert">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% block content %}
        {% endblock %}

        {% include '_footer.html' %}



    <!-- MDB -->
        <script type="text/javascript" src="{% static 'js/mdb.umd.min.js' %}"></script>
    <!-- Custom scripts -->
    <script type="text/javascript">
        setTimeout(function () {
            document.querySelectorAll('.site-alert').forEach(function (el) { el.style.display = 'none'; });
        }, 5000);
    </script>
    </body>
</html>
